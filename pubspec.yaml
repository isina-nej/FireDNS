name: firedns
description: A DNS over HTTPS client
display_name: FireDNS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # firebase_core: ^2.15.1 # TODO: Will be added when Firebase access is provided
  # firebase_messaging: ^14.6.7 # TODO: Will be added when Firebase access is provided
  device_info_plus: ^8.0.0
  lottie: ^2.6.0
  cupertino_icons: ^1.0.5
  http: ^0.13.6
  json_annotation: ^4.8.1
  shared_preferences: ^2.1.1
  provider: ^6.0.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0
  connectivity_plus: ^4.0.2
  percent_indicator: ^4.2.3
  vibration: ^1.8.1
  flutter_spinkit: ^5.2.0
  flutter_gen: ^5.3.1
  flutter_speed_test_plus: ^1.0.10
  syncfusion_flutter_gauges: ^22.2.12
  sleek_circular_slider: ^2.1.0
  dart_ping: ^9.0.1
  url_launcher: ^6.3.2
  msix: ^3.16.10
  carrier_info: ^2.0.8
  sim_card_info: ^1.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  speed_checker_plugin: ^1.0.27


flutter:
  uses-material-design: true
  assets:
    - assets/icone/Fire.json
    - assets/icone/laptop.json
    - assets/icone/settings.json
    - assets/config/firebase-service-account.json

