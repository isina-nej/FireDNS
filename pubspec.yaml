name: firedns
description: A DNS over HTTPS client
display_name: FireDNS
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  device_info_plus: ^11.3.0
  lottie: ^3.3.1
  cupertino_icons: ^1.0.5
  http: ^1.4.0
  json_annotation: ^4.8.1
  shared_preferences: ^2.1.1
  provider: ^6.0.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  percent_indicator: ^4.2.3
  vibration: ^3.1.3
  flutter_spinkit: ^5.2.0
  flutter_gen: ^5.3.1
  syncfusion_flutter_gauges: ^30.2.4
  sleek_circular_slider: ^2.1.0
  url_launcher: ^6.3.2
  msix: ^3.16.10
  carrier_info: ^3.0.3
  timeago: ^3.7.1
  markdown_widget: ^2.3.2+8
  webview_flutter: ^4.13.0
  flutter_speed_test_plus: ^1.0.10
  pool: ^1.5.1
  dart_ping: ^9.0.1
  logger: ^2.0.2+1
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  animations: ^2.0.11
  get: ^4.6.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  speed_checker_plugin: ^1.0.27


flutter:
  uses-material-design: true
  assets:
    - assets/icone/Fire.json
    - assets/icone/laptop.json
    - assets/icone/settings.json
    - assets/icone/success_animation.json
    - assets/icone/telegram.json
    - assets/icone/instagram.json
    - assets/icone/linkedin.json
    - assets/icone/tiktok.json
    - assets/icone/twitter.json
    - assets/icone/about.json
    - assets/icone/language.json
    - assets/icone/notifications.json
    - assets/icone/theme.json
    - assets/icone/info.json
    - assets/icone/dns.json
    - assets/icone/test_type.json
    - assets/icone/power.json
    - assets/icone/support.json
    - assets/icone/speed_test_alt.json
    - assets/icone/github_alt.json
    - assets/icone/website_new.json
    - assets/icone/connected.json
    - assets/icone/WiFiConnecting.json
    - assets/icone/process.json
    - assets/logo/logo.png
  fonts:
      - family: IranSansX
        fonts:
          - asset: assets/font/IranSansX/IRANSansX-Regular.ttf
            weight: 400
          - asset: assets/font/IranSansX/IRANSansX-Medium.ttf
            weight: 500
          - asset: assets/font/IranSansX/IRANSansX-Bold.ttf
            weight: 700
          # حذف وزن‌های کم استفاده برای کاهش حجم
      - family: Poppins
        fonts:
          - asset: assets/font/Poppins/Poppins-Regular.ttf
            weight: 400
          - asset: assets/font/Poppins/Poppins-Medium.ttf
            weight: 500
          - asset: assets/font/Poppins/Poppins-Bold.ttf
            weight: 700
          # حذف وزن‌های کم استفاده برای کاهش حجم
